<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taka Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taka Ledger">
<meta name="theme-color" content="#00463c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a working accounts office: calm, exact, dense where numbers live.
   IDEA: a ledger book with a green cloth spine: double entry under everything.
   PICTURE: the live dashboard: cash, profit, and a 12-month income vs spending chart.
   COLOUR and TYPE: deep green #00463c spine, white pages, lime-white highlight, coral for trouble; Inter Tight + Inter.
   LAYOUT: fixed sidebar spine, top bar with search and New, wide content; stacks below 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6f5,#0b1311);--panel:light-dark(#ffffff,#121d1a);--tx:light-dark(#14201c,#e5eeea);--mut:light-dark(#5d6b66,#93a39d);
--line:light-dark(#dfe5e2,#22322d);--line2:light-dark(#eef2f0,#18251f);--pri:light-dark(#00463c,#3fbf98);--prit:light-dark(#ffffff,#05201a);--pri2:light-dark(#005a4d,#57d1ab);
--hi:light-dark(#e6f5c8,#203a22);--hit:light-dark(#22400f,#d6f0b0);--bad:light-dark(#c8432f,#ff8a77);--badbg:light-dark(#ffe9e5,#3a1f1a);--warn:light-dark(#9a5b00,#f2b54d);--warnbg:light-dark(#fff2d6,#3a2c12);
--okc:light-dark(#0a6b3c,#5fd59a);--okbg:light-dark(#e1f5ea,#123323);--info:light-dark(#1f5fb4,#8db7ff);--infobg:light-dark(#e5efff,#172a45);
--side:#00463c;--sidetx:#cfe3dc;--s1:light-dark(#257de0,#338ced);--s2:light-dark(#f47230,#e76624);--shadow:0 1px 2px rgba(10,30,25,.06),0 2px 6px rgba(10,30,25,.05)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-theme=dark]{--side:#062a24}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;overflow-x:clip}
h1,h2,h3,.tight{font-family:"Inter Tight",Inter,system-ui,sans-serif}
#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
#side{background:var(--side);color:var(--sidetx);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px;color:#fff;font:700 17px "Inter Tight",Inter,sans-serif}
.logo{width:32px;height:32px;border-radius:8px;background:#e6f5c8;color:#00463c;display:grid;place-items:center;font-weight:800;font-size:17px}
.bookbtn{margin:0 12px 12px;padding:9px 11px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;text-align:left;cursor:pointer;font:inherit;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:44px}
.bookbtn svg{width:16px;height:16px;flex:none}.bookbtn b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bookbtn small{display:block;color:var(--sidetx);font-size:12px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 18px;color:var(--sidetx);text-decoration:none;border-left:3px solid transparent;cursor:pointer;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}.nav a.on{background:rgba(230,245,200,.12);color:#fff;border-left-color:#e6f5c8}
.nav svg{width:18px;height:18px;flex:none}.sidefoot{margin-top:auto;padding:14px 16px;font-size:12px;color:var(--sidetx);opacity:.85}
#top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 22px;min-height:58px}
.search{flex:1;max-width:480px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;color:var(--mut);cursor:text;min-height:40px}
.search svg{width:16px;height:16px}.search span{flex:1}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--mut);background:var(--panel)}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}.sync.ok i{background:var(--okc)}.sync.busy i{background:var(--warn)}
main{padding:22px 26px 70px;max-width:1340px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:26px;line-height:1.1;margin:0}.ph p{margin:4px 0 0;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px}
.card h2{font-size:15.5px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font:500 12.5px Inter,sans-serif;color:var(--mut)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpi{cursor:pointer}.kpi .l{color:var(--mut);font-size:13px;font-weight:600}.kpi .v{font:700 clamp(20px,2.2vw,26px) "Inter Tight",Inter,sans-serif;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}.kpi .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.pos{color:var(--okc)}.neg{color:var(--bad)}.mut{color:var(--mut)}.sm{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--tx);padding:0 13px;min-height:38px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}.btn:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn.p{background:var(--pri);border-color:var(--pri);color:var(--prit)}.btn.p:hover{background:var(--pri2)}
.btn.d{color:var(--bad)}.btn.s{min-height:30px;padding:0 9px;font-size:12.5px}.btn.g{border-color:transparent;background:none}.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:14.5px;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:0 9px;min-height:38px}
textarea{padding:8px 9px}input[type=checkbox]{min-height:auto;width:17px;height:17px;accent-color:var(--pri)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pri) 30%,transparent);border-color:var(--pri)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut);font-weight:600}
.fr{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:12.5px;color:var(--mut);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--line2);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr.cl{cursor:pointer}.t tr.cl:hover td{background:color-mix(in srgb,var(--pri) 5%,transparent)}
.t .n,.t th.n{text-align:right;white-space:nowrap}.t tfoot td{font-weight:700;border-top:1px solid var(--line)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--okc)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-info{background:var(--infobg);color:var(--info)}.b-mut{background:var(--line2);color:var(--mut)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:10px 14px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}.tabs a.on{color:var(--pri);border-bottom-color:var(--pri)}
.mbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-bottom:16px}
.mbar>div{padding:12px 14px;background:var(--panel);border:1px solid var(--line);cursor:pointer}.mbar>div:first-child{border-radius:10px 0 0 10px}.mbar>div:last-child{border-radius:0 10px 10px 0}
.mbar .v{font:700 20px "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}.mbar .l{font-size:12.5px;color:var(--mut)}.mbar i{display:block;height:6px;border-radius:3px;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.hb .tr{height:14px;background:var(--line2);border-radius:3px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--pri);border-radius:0 4px 4px 0}
.hb b{font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{position:relative;min-height:260px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--tx);color:var(--panel);padding:7px 10px;border-radius:7px;font-size:12.5px;white-space:nowrap;z-index:3;display:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mut);margin-bottom:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.modal{position:fixed;inset:0;background:rgba(5,20,16,.5);display:none;z-index:50;overflow:auto;padding:28px 14px}
.modal.open{display:block}
.mbox{background:var(--bg);max-width:1160px;margin:0 auto;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden}
.mbox.nar{max-width:580px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:19px}.mb{padding:18px 20px}
.mf{display:flex;justify-content:space-between;gap:8px;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
.lines{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.lines th{font-size:12px;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.lines td{padding:4px 5px;border-bottom:1px solid var(--line2)}.lines input,.lines select{width:100%}.lines .ix{color:var(--mut);width:30px;text-align:center}
.lines .n,.lines .n input{text-align:right}
.tot{margin-left:auto;width:min(340px,100%);margin-top:12px}.tot>div{display:flex;justify-content:space-between;gap:18px;padding:4px 0;font-variant-numeric:tabular-nums}.tot .g{font:700 19px "Inter Tight",sans-serif;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.big{font:700 26px "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}
.pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 44px rgba(0,0,0,.22);display:none;padding:8px;max-height:80vh;overflow:auto}
.newmenu{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:4px 18px;padding:8px 10px}
.newmenu h4{margin:6px 0 4px;font-size:12px;color:var(--mut);font-weight:600}
.newmenu a,.plist a{display:flex;justify-content:space-between;gap:8px;padding:8px 9px;border-radius:6px;cursor:pointer}.newmenu a:hover,.plist a:hover,.plist a.on{background:var(--hi);color:var(--hit)}
#pal{left:50%;top:70px;transform:translateX(-50%);width:min(620px,94vw);padding:0}
#pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;min-height:50px;font-size:16px;padding:0 16px}
.plist{max-height:56vh;overflow:auto;padding:6px}.plist small{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:26px;width:max-content;max-width:92vw;text-align:center;transform:translateX(-50%);background:var(--tx);color:var(--panel);padding:10px 16px;border-radius:9px;z-index:90;display:none;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.replay{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.rlist h4{margin:14px 6px 4px;font-size:12.5px;color:var(--mut);font-weight:600}.rlist a{display:block;padding:8px 10px;border-radius:7px;cursor:pointer}.rlist a:hover{background:var(--line2)}.rlist a.on{background:var(--hi);color:var(--hit);font-weight:600}
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.rdoc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px clamp(14px,3vw,36px);box-shadow:var(--shadow)}
.rh{text-align:center;margin-bottom:20px}.rh .c{font:700 19px "Inter Tight",sans-serif}.rh .tt{font-size:16px;font-weight:600;margin-top:2px}.rh .pp{color:var(--mut);font-size:13px;margin-top:2px}
table.rt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
.rt th{text-align:right;border-bottom:2px solid var(--tx);padding:7px 8px;font-size:12.5px;white-space:nowrap}.rt th:first-child{text-align:left}
.rt td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}.rt td:first-child{text-align:left;white-space:normal}
.rt td.l{text-align:left;white-space:normal}.rt th.l{text-align:left}
.rt tr.sec td{font-weight:700;padding-top:14px;border-bottom:0}.rt tr.sub td{font-weight:700;border-top:1px solid var(--mut)}
.rt tr.gt td{font-weight:800;border-top:1px solid var(--tx);border-bottom:3px double var(--tx)}
.rt tr.dr{cursor:pointer}.rt tr.dr:hover td{background:var(--hi);color:var(--hit)}
.rt .i1 td:first-child{padding-left:24px}.rt .i2 td:first-child{padding-left:40px}
.rfoot{margin-top:18px;color:var(--mut);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;min-height:38px;cursor:pointer}
.welcome{max-width:880px;margin:6vh auto;padding:0 18px}
.welcome h1{font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.wopt{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow)}
.wopt:hover{border-color:var(--pri)}.wopt b{font:700 16px "Inter Tight",sans-serif}.wopt span{color:var(--mut);font-size:13.5px}
.inv{background:#fff;color:#111;padding:40px;border-radius:8px;font-size:13.5px}.inv h1{font-size:30px;margin:0;color:#00463c;letter-spacing:.02em}
.inv table{width:100%;border-collapse:collapse;margin-top:18px}.inv th{background:#00463c;color:#fff;text-align:left;padding:8px;font-size:12.5px}.inv td{padding:8px;border-bottom:1px solid #e3e3e3}.inv .n{text-align:right}
.hamb{display:none}
#print{display:none}
.bud input{width:92px;text-align:right;min-height:32px;padding:0 6px;font-size:13px}.bud td,.bud th{padding:4px 5px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){#app{grid-template-columns:minmax(0,1fr)}#side{position:fixed;left:-260px;width:250px;z-index:45;transition:left .2s}body.navopen #side{left:0}
 .hamb{display:inline-flex}.g2,.g3{grid-template-columns:minmax(0,1fr)}.replay{grid-template-columns:minmax(0,1fr)}main{padding:16px 14px 70px}#top{padding:8px 12px}.newmenu{grid-template-columns:minmax(0,1fr)}.sync span{display:none}}
@media (max-width:600px){.g4{grid-template-columns:minmax(0,1fr)}.mbar{grid-template-columns:minmax(0,1fr)}.mbar>div{border-radius:8px!important}input,select{font-size:16px}.search kbd,.search span{display:none}.search{flex:0 0 auto;max-width:none}.hb{grid-template-columns:minmax(0,1fr) auto}.hb .tr{grid-column:1/-1;order:3}}
@media print{body.pd #app,body.pd .modal,body.pd #toast,body.pd .pop{display:none!important}body.pd #print{display:block}body{background:#fff}
 #print{--panel:#fff;--tx:#000;--mut:#444;--line:#bbb;--line2:#eee;--hi:#eee;--hit:#000;color:#000}.rdoc{border:0;box-shadow:none;padding:0}}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mic{width:24px;height:24px}
body.mob #side,body.mob #top{display:none!important}body.mob #app{grid-template-columns:minmax(0,1fr)!important}
body.mob main{padding:calc(68px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom));max-width:none}
.mtop{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--side);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;min-height:56px}
.mtop .tt{flex:1;font:700 17px "Inter Tight",Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop button{background:rgba(255,255,255,.1);border:0;color:#fff;min-width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font:inherit;cursor:pointer}.mtop button svg{width:20px;height:20px}
.mtop .bk{display:flex;align-items:center;gap:6px;padding:0 12px;max-width:62vw;font-weight:600}.mtop .bk svg{flex:none;width:16px}
.mnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.mnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mut);cursor:pointer;min-height:52px;justify-content:center;text-decoration:none}
.mnav a svg{width:22px;height:22px}.mnav a.on{color:var(--pri);font-weight:700}
.mnav .fab{width:60px;height:60px;border-radius:50%;background:var(--pri);color:var(--prit);margin-top:-28px;box-shadow:0 6px 18px rgba(0,70,60,.35);display:grid;place-items:center;border:4px solid var(--bg)}.mnav .fab svg{width:28px;height:28px}
.mmonth{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mmonth b{font:700 18px "Inter Tight",Inter,sans-serif}.mmonth .btn{min-width:44px;min-height:44px}
.hero{background:var(--side);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.hero .l{color:#cfe3dc;font-size:13px}.hero .v{font:700 clamp(28px,9vw,38px) "Inter Tight",Inter,sans-serif;font-variant-numeric:tabular-nums;margin:2px 0 12px;white-space:nowrap}
.hero .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.hero .two b{display:block;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .meter{height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:14px;overflow:hidden}.hero .meter i{display:block;height:100%;background:#e6f5c8;border-radius:4px}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 14px 6px;margin:0 -14px 12px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}.hs>*{scroll-snap-align:start;flex:none}
.acard{width:160px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:999px;padding:0 14px;min-height:44px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip .av{width:26px;height:26px;font-size:12px;margin-left:-8px}.chip.on{background:var(--pri);border-color:var(--pri);color:var(--prit)}

<script>
{
'use strict';
// ================= utilities =================
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const r2=n=>Math.round((+n||0)*100)/100;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=new Date(s+'T12:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const monthEnd=(y,m)=>y+'-'+pad(m)+'-'+pad(new Date(y,m,0).getDate());
const ymOf=s=>s.slice(0,7);
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function fd(s){if(!s)return'';const f=(B()&&B().set.df)||'dmy';const[y,m,d]=s.split('-');return f==='iso'?s:f==='mdy'?m+'/'+d+'/'+y:f==='dmon'?(+d)+' '+MON[m-1]+' '+y:d+'/'+m+'/'+y}
const fdl=s=>{const[y,m,d]=s.split('-');return (+d)+' '+MONL[m-1]+' '+y};
const loc=()=>(B()&&B().set.loc)||'en-IN';
const sym=()=>(B()&&B().set.cur)||'৳';
function num(n){return Math.abs(r2(n)).toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(n){const v=r2(n);return(v<0?'−':'')+sym()+num(v)}
function rn(v){if(v==null||v==='')return'';v=r2(v);if(Math.abs(v)<0.005)return'–';return v<0?'('+num(v)+')':num(v)}
function compact(n){try{return sym()+new Intl.NumberFormat(loc(),{notation:'compact',maximumFractionDigits:1}).format(n)}catch(e){return sym()+Math.round(n)}}
function amt(v){v=String(v??'').replace(/[,\s৳$€£₹]/g,'');if(!v)return 0;if(/^[\d.+\-*/()]+$/.test(v)){try{const x=Function('"use strict";return ('+v+')')();return isFinite(x)?r2(x):NaN}catch(e){return NaN}}return NaN}

accts:'<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>',proj:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
budget:'<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 6"/>',reports:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',import:'<path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3"/>',
setup:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/>',dl:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4"/>',chev:'<path d="M8 10l4 4 4-4"/>',back:'<path d="M15 6l-6 6 6 6"/>'};

// ================= model =================
const AT={bank:{n:'Bank & cash',g:'A'},ar:{n:'Accounts receivable',g:'A'},oca:{n:'Other current assets',g:'A'},fa:{n:'Fixed assets',g:'A'},
ap:{n:'Accounts payable',g:'L'},cc:{n:'Credit cards',g:'L'},ocl:{n:'Other current liabilities',g:'L'},ltl:{n:'Long-term liabilities',g:'L'},
eq:{n:'Equity',g:'E'},inc:{n:'Income',g:'I'},oinc:{n:'Other income',g:'I'},cogs:{n:'Cost of sales',g:'X'},exp:{n:'Expenses',g:'X'},oexp:{n:'Other expenses',g:'X'}};

const BIZ=[['bank','Cash in hand'],['bank','Bank account (current)'],['bank','bKash merchant'],['bank','Nagad'],['ar','Accounts receivable','ar'],['oca','Advances & deposits'],['oca','Prepaid expenses'],
['fa','Office furniture & equipment'],['fa','Lab & field equipment'],['fa','Vehicles'],['fa','Accumulated depreciation','dep'],['ap','Accounts payable','ap'],['cc','Company credit card'],
['ocl','VAT payable','vat'],['ocl','Tax deducted at source (payable)'],['ocl','Accrued expenses'],['ltl','Bank loan'],['eq',"Owner's capital"],['eq',"Owner's drawings"],['eq','Opening balance equity','obe'],['eq','Retained earnings','re'],
['inc','Consultancy & design fees'],['inc','Survey income'],['inc','Soil & lab testing income'],['inc','Sales of goods'],['inc','Other operating income'],['oinc','Interest income'],['oinc','Other income'],
['cogs','Direct materials'],['cogs','Subcontractor costs'],['exp','Salaries & wages'],['exp','Office rent'],['exp','Utilities'],['exp','Phone & internet'],['exp','Field transport & travel'],['exp','Fuel'],
['exp','Repairs & maintenance'],['exp','Printing & stationery'],['exp','Lab consumables'],['exp','Professional fees'],['exp','Licences, fees & taxes'],['exp','Bank charges'],['exp','Advertising & marketing'],
['exp','Meals & entertainment'],['exp','Depreciation'],['exp','Miscellaneous expense'],['oexp','Loan interest'],['oexp','Income tax expense']];
const PER=[['bank','Cash wallet'],['bank','Salary account'],['bank','Savings account'],['bank','bKash'],['bank','Nagad'],['ar','Money owed to me','ar'],['oca','Fixed deposits (FDR)'],['oca','Savings certificates'],['oca','Investment in business'],
['fa','Home & property'],['fa','Vehicle'],['fa','Gold & jewellery'],['ap','Bills to pay','ap'],['cc','Credit card'],['ocl','Money borrowed'],['ltl','Home loan'],['eq','Opening net worth','obe'],['eq','Retained earnings','re'],
['inc','Salary'],['inc','Income from business'],['inc','Rental income'],['inc','Freelance income'],['oinc','Interest & profit'],['oinc','Gifts received'],['oinc','Other income'],
['exp','Groceries'],['exp','House rent'],['exp','Utilities'],['exp','Mobile & internet'],['exp','Transport'],['exp','School & tuition fees'],['exp','Medical'],['exp','Clothing'],['exp','Household help'],
['exp','Festival & gifts'],['exp','Charity & zakat'],['exp','Dining out'],['exp','Entertainment'],['exp','Insurance'],['exp','Personal care'],['exp','Home maintenance'],['exp','Miscellaneous'],['oexp','Loan interest'],['oexp','Income tax']];

let DB={books:[],cur:null,t:0,theme:''};
const B=()=>DB.books.find(b=>b.id===DB.cur)||null;
const biz=()=>B()&&B().kind==='business';
function mkAcct(type,name,f,b){b=b||B();const used=b.accounts.filter(a=>a.type===type).map(a=>+a.code||0);const a={id:uid(),code:String(used.length?Math.max(...used)+10:CODE0[type]+10),name,type,f:f||'',desc:'',off:false};b.accounts.push(a);return a}
function newBook(name,kind){const b={id:uid(),name,kind,v:1,set:{cur:'৳',loc:'en-IN',fy:kind==='business'?7:1,df:'dmy',addr:'',phone:'',email:'',tin:'',bin:'',vat:0,invPrefix:'INV-',invNext:1001,terms:30,footer:kind==='business'?'Thank you for your business. Please pay by the due date.':''},accounts:[],contacts:[],classes:[],items:[],txns:[],budgets:{}};
 (kind==='business'?BIZ:PER).forEach(([t,n,f])=>mkAcct(t,n,f,b));return b}
const acc=id=>B().accounts.find(a=>a.id===id);
const aname=id=>{const a=acc(id);return a?a.name:''};
function accBy(flag){const b=B();let a=b.accounts.find(x=>x.f===flag);if(!a){const sp={ar:['ar','Accounts receivable'],ap:['ap','Accounts payable'],vat:['ocl','VAT payable'],obe:['eq','Opening balance equity'],re:['eq','Retained earnings']}[flag];a=mkAcct(sp[0],sp[1],flag)}return a}
function findOrMk(type,name,b){b=b||B();return b.accounts.find(a=>a.name.toLowerCase()===String(name).toLowerCase())||mkAcct(type,name,'',b)}
const cname=id=>{const c=B().contacts.find(x=>x.id===id);return c?c.name:''};
const clname=id=>{const c=B().classes.find(x=>x.id===id);return c?c.name:''};
function contactFor(name,kind){name=(name||'').trim();if(!name)return'';const b=B();let c=b.contacts.find(x=>x.name.toLowerCase()===name.toLowerCase());
 if(!c){c={id:uid(),name,kind:kind||'v',email:'',phone:'',addr:'',notes:''};b.contacts.push(c)}else if(kind&&c.kind!==kind&&c.kind!=='b')c.kind='b';return c.id}
const isCust=c=>c.kind==='c'||c.kind==='b',isVend=c=>c.kind==='v'||c.kind==='b';
const defBank=()=>{const b=B();return(b.accounts.find(a=>a.type==='bank'&&!a.off)||{}).id||''};
const defInc=()=>{const b=B();return(b.accounts.find(a=>a.type==='inc'&&!a.off)||{}).id||''};

const TL={exp:'Expense',dep:'Deposit',inv:'Invoice',bill:'Bill',rcv:'Payment received',pay:'Bill payment',xfer:'Transfer',je:'Journal entry'};
const tl=t=>(!biz()&&t==='dep')?'Income / deposit':(!biz()&&t==='rcv')?'Money received back':TL[t];
const lineAmt=i=>r2((+i.qty||0)*(+i.rate||0)),lineTax=i=>r2(lineAmt(i)*(+i.tax||0)/100);
function ttotal(t){switch(t.type){case'inv':return r2((t.items||[]).reduce((s,i)=>s+lineAmt(i)+lineTax(i),0));case'rcv':case'pay':case'xfer':return r2(t.amount);
 case'je':return r2((t.rows||[]).reduce((s,r)=>s+(+r.d||0),0));default:return r2((t.rows||[]).reduce((s,r)=>s+(+r.amt||0),0))}}
function linesOf(t){const L=[],P=(a,v,m,k)=>{v=r2(v);if(!v||!a)return;L.push(v>0?{a,d:v,c:0,m:m||'',k:k||''}:{a,d:0,c:-v,m:m||'',k:k||''})},k0=t.k||'';
 switch(t.type){
  case'exp':(t.rows||[]).forEach(r=>P(r.a,r.amt,r.m,r.k||k0));P(t.acct,-ttotal(t),t.memo);break;
  case'dep':(t.rows||[]).forEach(r=>P(r.a,-r.amt,r.m,r.k||k0));P(t.acct,ttotal(t),t.memo);break;
  case'bill':(t.rows||[]).forEach(r=>P(r.a,r.amt,r.m,r.k||k0));P(accBy('ap').id,-ttotal(t),t.memo);break;
  case'inv':{let tx=0;P(accBy('ar').id,ttotal(t),t.memo);(t.items||[]).forEach(i=>{P(i.a||defInc(),-lineAmt(i),i.desc,i.k||k0);tx+=lineTax(i)});if(tx)P(accBy('vat').id,-tx,'VAT');break}
  case'rcv':P(t.acct,t.amount,t.memo);P(accBy('ar').id,-t.amount,t.memo);break;
  case'pay':P(accBy('ap').id,t.amount,t.memo);P(t.acct,-t.amount,t.memo);break;
  case'xfer':P(t.to,t.amount,t.memo);P(t.acct,-t.amount,t.memo);break;
  case'je':(t.rows||[]).forEach(r=>{P(r.a,+r.d||0,r.m,r.k||k0);P(r.a,-(+r.c||0),r.m,r.k||k0)});break}
 return L}
let _lc={};
function ledger(basis){const b=B(),key='L'+(basis||'a')+b.v;if(_lc[key])return _lc[key];const out=[],byId={};b.txns.forEach(t=>byId[t.id]=t);
 for(const t of b.txns){if(basis==='cash'&&(t.type==='inv'||t.type==='bill'))continue;let L=linesOf(t);
  if(basis==='cash'&&(t.type==='rcv'||t.type==='pay')){const ctl=accBy(t.type==='rcv'?'ar':'ap').id,nl=L.filter(l=>l.a!==ctl);let rest=r2(t.amount);
   for(const ap of t.apply||[]){const doc=byId[ap.id];if(!doc)continue;const tot=ttotal(doc);if(!tot)continue;const f=ap.amt/tot;for(const l of linesOf(doc))if(l.a!==ctl)nl.push({a:l.a,d:r2(l.d*f),c:r2(l.c*f),m:l.m,k:l.k});rest=r2(rest-ap.amt)}
   if(rest)nl.push(t.type==='rcv'?{a:ctl,d:0,c:rest,m:'Unapplied',k:''}:{a:ctl,d:rest,c:0,m:'Unapplied',k:''});L=nl}
  for(const l of L)out.push(Object.assign(l,{t,date:t.date}))}
 out.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);return _lc[key]=out}
function sums(from,to,o){o=o||{};const m={};for(const l of ledger(o.basis)){if(from&&l.date<from)continue;if(to&&l.date>to)break;if(o.k&&l.k!==o.k)continue;if(o.ct&&l.t.contact!==o.ct)continue;m[l.a]=(m[l.a]||0)+l.d-l.c}return m}
const DN=a=>{const g=AT[a.type].g;return g==='A'||g==='X'};
const nat=(a,v)=>DN(a)?(v||0):-(v||0);
function payMap(){const b=B(),k='P'+b.v;if(_lc[k])return _lc[k];const m={};for(const t of b.txns)if(t.type==='rcv'||t.type==='pay')for(const a of t.apply||[])(m[a.id]=m[a.id]||[]).push({t,amt:+a.amt||0});return _lc[k]=m}
function docBal(d,ex,asof){return r2(ttotal(d)-(payMap()[d.id]||[]).filter(p=>p.t.id!==ex&&(!asof||p.t.date<=asof)).reduce((s,p)=>s+p.amt,0))}
function docStatus(d){const bal=docBal(d),tot=ttotal(d);if(bal<=0.004)return['Paid','ok'];if(d.due&&d.due<today())return['Overdue '+daysBetween(d.due,today())+' days','bad'];if(bal<tot-0.004)return['Partly paid','info'];return['Open','warn']}
function period(p,ref){ref=ref||today();const fy=(B()&&B().set.fy)||1,[y,m]=ref.split('-').map(Number),q=Math.floor((m-1)/3),fyY=m>=fy?y:y-1,fyS=fyY+'-'+pad(fy)+'-01',fyE=addDays(addMonths(fyS,12),-1),ms=y+'-'+pad(m)+'-01';
 switch(p){case'tm':return[ms,monthEnd(y,m)];case'lm':{const s=addMonths(ms,-1),[a,c]=s.split('-').map(Number);return[s,monthEnd(a,c)]}
  case'tq':return[y+'-'+pad(q*3+1)+'-01',monthEnd(y,q*3+3)];case'lq':{const s=addMonths(y+'-'+pad(q*3+1)+'-01',-3),[a,c]=s.split('-').map(Number);return[s,monthEnd(a,c+2)]}
  case'ty':return[fyS,fyE];case'ytd':return[fyS,ref];case'ly':return[addMonths(fyS,-12),addDays(fyS,-1)];case'cy':return[y+'-01-01',y+'-12-31'];
  case'l12':return[addMonths(ms,-11),monthEnd(y,m)];case'all':{const b=B(),ds=b.txns.map(t=>t.date).sort();return[ds[0]||ms,ds[ds.length-1]>ref?ds[ds.length-1]:ref]}}
 return[ms,monthEnd(y,m)]}
const fyStart=d=>period('ty',d)[0];
const PERIODS=[['tm','This month'],['lm','Last month'],['tq','This quarter'],['lq','Last quarter'],['ytd','Fiscal year to date'],['ty','This fiscal year'],['ly','Last fiscal year'],['cy','This calendar year'],['l12','Last 12 months'],['all','All dates'],['custom','Custom']];
function tdesc(t){const ls=linesOf(t);const main=t.type==='exp'||t.type==='dep'||t.type==='bill'?(t.rows||[]).filter(r=>r.a&&+r.amt):null;
 if(main)return main.length>1?'Split ('+main.length+' lines)':aname(main[0]&&main[0].a);if(t.type==='inv')return(t.items||[]).map(i=>i.desc||aname(i.a)).filter(Boolean).slice(0,2).join(', ');
 if(t.type==='xfer')return aname(t.acct)+' → '+aname(t.to);if(t.type==='rcv'||t.type==='pay')return(t.apply||[]).length?((t.apply||[]).length+' document(s)'):'Unapplied';
 return ls.length+' lines'}

function chunks(){const o={index:{books:DB.books.map(b=>b.id),cur:DB.cur,t:DB.t,theme:DB.theme||''}};
 for(const b of DB.books){const meta=Object.assign({},b);delete meta.txns;o['bk_'+b.id]={book:meta};const by={};for(const t of b.txns)(by[ymOf(t.date)]=by[ymOf(t.date)]||[]).push(t);for(const k in by)o['tx_'+b.id+'_'+k]={txns:by[k]}}return o}
function save(){DB.t=Date.now();const ok=lsSave();if(ST.col){clearTimeout(save.h);setSync('busy','Saving…');save.h=setTimeout(cloudPush,700)}else setSync(ok?'':'busy',ok?'Saved in this browser':'Not saved: download a backup')}
async function cloudPush(){if(!ST.col)return;if(ST.busy){ST.again=true;return}ST.busy=true;
 try{const c=chunks();for(const k in c){const j=JSON.stringify(c[k]);if(ST.last[k]!==j){await ST.col.doc(k).set(c[k]);ST.last[k]=j}}
  for(const k of Object.keys(ST.last))if(!(k in c)){await ST.col.doc(k).delete();delete ST.last[k]}setSync('ok','Saved to your account')}
 catch(e){setSync('busy',e&&e.code==='quota_exceeded'?'Account storage full: download a backup':'Saved in this browser only');console.warn(e)}
 ST.busy=false;if(ST.again){ST.again=false;cloudPush()}}
async function cloudInit(){try{if(!window.claude||!claude.use)return;
  claude.use('downloads').then(d=>{if(d){ST.dl=d;render()}}).catch(()=>{});
  const db=await claude.use('db');if(!db)return;const user=await claude.use('user');const id=user&&await user.id();if(!id)return;
  const col=db.collection('data/users/'+id);setSync('busy','Connecting…');
  const timer=setTimeout(()=>setSync('busy','Account storage not reachable yet'),10000);
  const snap=await col.limit(1000).get();clearTimeout(timer);const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});
  ST.col=col;
  if(m.index&&(m.index.t||0)>(DB.t||0)){const books=[];for(const bid of m.index.books||[]){const bk=m['bk_'+bid];if(!bk)continue;const b=JSON.parse(JSON.stringify(bk.book));b.txns=[];
    for(const k in m)if(k.startsWith('tx_'+bid+'_'))b.txns.push(...JSON.parse(JSON.stringify(m[k].txns||[])));books.push(b)}
   DB={books,cur:m.index.cur,t:m.index.t,theme:m.index.theme||''};for(const k in m)ST.last[k]=JSON.stringify(m[k]);lsSave();_lc={};applyTheme();render();setSync('ok','Loaded from your account')}
  else{for(const k in m)ST.last[k]=JSON.stringify(m[k]);if(DB.books.length)cloudPush();else setSync('ok','Connected to your account')}}
 catch(e){console.warn(e);setSync('busy','Saved in this browser only')}}

async function download(filename,data,type){
 if(!ST.dl&&matchMedia('(pointer:coarse)').matches&&navigator.canShare){try{const f=new File([data],filename,{type:type||'text/plain'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});toast('Saved '+filename);return}}catch(e){if(e&&e.name==='AbortError'){toast('Cancelled');return}}}
 if(ST.dl){try{await ST.dl.save({filename,data});toast('Download started: '+filename)}catch(e){toast('Download was cancelled')}return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type||'text/plain'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();toast('Downloaded '+filename)}catch(e){toast('Downloads are blocked here: use Copy instead')}}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Copied to clipboard')}catch(e){toast('Copy was blocked by the browser')}}

function monthly(n){const end=today(),start=addMonths(end.slice(0,8)+'01',-(n-1)),ms=[];for(let i=0;i<n;i++)ms.push(ymOf(addMonths(start,i)));const m={};ms.forEach(k=>m[k]={i:0,e:0});
 for(const l of ledger()){if(l.date<start)continue;const a=acc(l.a);if(!a)continue;const g=AT[a.type].g,k=ymOf(l.date);if(!m[k])continue;if(g==='I')m[k].i+=l.c-l.d;else if(g==='X')m[k].e+=l.d-l.c}return ms.map(k=>({k,...m[k]}))}
function drawChart(box){const s=$('svg',box),tip=$('.tip',box),data=JSON.parse(box.dataset.chart);
 const draw=()=>{const W=box.clientWidth,H=box.clientHeight;if(!W)return;const narrow=W<520,pl=narrow?44:62,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const mx=Math.max(1,...data.map(d=>Math.max(d.i,d.e)));const st=niceStep(mx/4),top=Math.ceil(mx/st)*st;const y=v=>pt+ih-(v/top)*ih;
  let h='';for(let v=0;v<=top+1e-9;v+=st)h+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${esc(compact(v))}</text>`;
  const gw=iw/data.length,bw=Math.max(3,Math.min(22,(gw-8)/2));
  data.forEach((d,i)=>{const cx=pl+gw*i+gw/2;[[d.i,'var(--s1)',-1],[d.e,'var(--s2)',1]].forEach(([v,c,side])=>{if(v<=0)return;const x=side<0?cx-bw-1:cx+1,yy=y(v),hh=pt+ih-yy;
    h+=`<path d="M${x},${pt+ih}V${yy+Math.min(4,hh)}q0,-4 4,-4h${bw-8>0?bw-8:0}q4,0 4,4V${pt+ih}z" fill="${c}"/>`});
   if(!narrow||i%2===0)h+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mut)">${MON[+d.k.slice(5)-1]}${narrow?'':' '+d.k.slice(2,4)}</text>`;
   h+=`<rect x="${pl+gw*i}" y="${pt}" width="${gw}" height="${ih}" fill="transparent" data-i="${i}"/>`});
  h+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--mut)"/>`;s.innerHTML=h;
  s.onmousemove=e=>{const r=e.target.closest('rect[data-i]');if(!r){tip.style.display='none';return}const d=data[+r.dataset.i],[Y,M]=d.k.split('-');
   tip.innerHTML=`<b>${MONL[M-1]} ${Y}</b><br>${biz()?'Income':'Income'}: ${esc(money(d.i))}<br>${biz()?'Expenses':'Spending'}: ${esc(money(d.e))}<br>Net: ${esc(money(d.i-d.e))}`;tip.style.display='block';
   const bx=box.getBoundingClientRect();let lx=e.clientX-bx.left+12;if(lx>W-170)lx-=190;tip.style.left=lx+'px';tip.style.top=Math.max(0,e.clientY-bx.top-40)+'px'};s.onmouseleave=()=>tip.style.display='none'};
 if(box._ro)box._ro.disconnect();box._ro=new ResizeObserver(draw);box._ro.observe(box);draw()}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1))),f=x/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

function plColumns(f,t,mode){const R=S.R;if(mode==='month'||mode==='quarter'){const cs=[];let s=f.slice(0,8)+'01';const step=mode==='month'?1:3;while(s<=t&&cs.length<36){const e0=addDays(addMonths(s,step),-1),e=e0>t?t:e0;cs.push({l:mode==='month'?MON[+s.slice(5,7)-1]+' '+s.slice(2,4):'Q '+MON[+s.slice(5,7)-1]+'–'+MON[+e.slice(5,7)-1]+' '+e.slice(2,4),f:s<f?f:s,t:e});s=addMonths(s,step)}cs.push({l:'Total',f,t,tot:1});return cs}
 if(mode==='class'){const cs=B().classes.map(c=>({l:esc(c.name),f,t,k:c.id}));cs.push({l:'Not tagged',f,t,k:'__none'});cs.push({l:'Total',f,t,tot:1});return cs}

function rPL(force){const R=S.R,[f,t]=rp(),bz=biz(),mode=force||R.cols,cs=plColumns(f,t,mode),SM=colSums(cs),b=B(),rows=[];

  for(const a of L){const v=cs.map((c,i)=>val(a,i));if(R.hz&&v.every(x=>Math.abs(x)<0.005))continue;v.forEach((x,i)=>tot[i]+=x);body.push({c:[esc(a.name),...cellsFor(v,cs)],cls:'i1',dr:a.id})}

 const I=group(['inc'],'Income'),C=group(['cogs'],'Cost of sales'),X=group(['exp'],bz?'Expenses':'Spending'),OI=group(['oinc'],'Other income'),OX=group(['oexp'],bz?'Other expenses':'Other spending');

function bsAt(asof){const R=S.R,b=B(),s=sums(null,asof,{basis:R.basis}),fs=fyStart(asof),pre=sums(null,addDays(fs,-1),{basis:R.basis});let pl=0,ni=0;

function rBS(){const R=S.R,[,t]=rp(),b=B(),bz=biz();const dates=R.cols==='prev'?[t,addDays(period('tm',t)[0],-1)]:R.cols==='py'?[t,addMonths(t,-12)]:[t];const D=dates.map(bsAt),cmp=dates.length>1,rows=[];

 const ll=put(grp(['ltl'],'Long-term liabilities'));const tl2=add(cl,ll);rows.push({c:['Total liabilities',...cell(tl2)],cls:'sub'});

 return rhead(repName('bs'),'As of '+fdl(t))+RT(['',...(cmp?[fd(dates[0]),fd(dates[1]),'Change']:['Total'])],rows)+`<p class="sm" style="margin-top:10px">${ok?'<span class="badge b-ok">Balanced</span> Assets equal liabilities plus '+(bz?'equity':'net worth')+'.':'<span class="badge b-bad">Out of balance</span> Check for incomplete entries.'}</p>`+rfoot(1)}

function rCF(){const[f,t]=rp(),b=B(),s=sums(f,t),rows=[];let ni=0;for(const a of b.accounts)if(isPL(a.type))ni-=s[a.id]||0;
 const line=a=>-(s[a.id]||0);const blk=(label,L,start)=>{rows.push({c:[label,''],cls:'sec'});let tot=start||0;if(start!=null)rows.push({c:[biz()?'Net profit':'Net savings',rn(start)],cls:'i1'});

 const op=blk('Operating activities',b.accounts.filter(a=>['ar','oca','ap','cc','ocl'].includes(a.type)||a.f==='dep'),ni);
 const inv=blk('Investing activities',b.accounts.filter(a=>a.type==='fa'&&a.f!=='dep'));const fin=blk('Financing activities',b.accounts.filter(a=>['ltl','eq'].includes(a.type)));
 const banks=b.accounts.filter(a=>a.type==='bank'),open=sums(null,addDays(f,-1)),close=sums(null,t),ob=banks.reduce((x,a)=>x+(open[a.id]||0),0),cb=banks.reduce((x,a)=>x+(close[a.id]||0),0);

function rBVA(){const R=S.R,[f,t]=rp(),b=B(),s=sums(f,t,{k:R.k}),ms=[];let m=f.slice(0,7);while(m<=t.slice(0,7)&&ms.length<60){ms.push(m);m=ymOf(addMonths(m+'-01',1))}

function qKey(k){let s=Q.v;if(k==='⌫')s=s.slice(0,-1);else if(k==='='){const v=amt(s);if(!isNaN(v))s=String(v)}else if(k==='−'||k==='+'){if(s&&!/[+\-.]$/.test(s))s+=k==='−'?'-':'+'}else if(k==='.'){const last=s.split(/[+\-]/).pop();if(!last.includes('.'))s+=(last?'':'0')+'.'}else if(s.replace(/\D/g,'').length<12){if(!(s==='0'&&k!=='.'))s+=k;else s=k}
 Q.v=s;try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}qDraw()}
function qSave(more){const b=B(),v=amt(Q.v);if(isNaN(v)||!(v>0))return toast('Enter an amount above zero');if(!Q.date)return toast('Pick a date');const base={id:uid(),date:Q.date,no:'',memo:Q.memo.trim(),k:'',ts:Date.now()};let t;
 if(Q.t==='xfer'){if(!Q.acct||!Q.to)return toast('Choose both accounts');if(Q.acct===Q.to)return toast('Choose two different accounts');t=Object.assign(base,{type:'xfer',contact:'',acct:Q.acct,to:Q.to,amount:v})}
 else{if(!Q.cat)return toast('Choose a category');if(!Q.acct)return toast('Choose an account');t=Object.assign(base,{type:Q.t,contact:contactFor(Q.cn,Q.t==='dep'?'c':'v'),acct:Q.acct,rows:[{a:Q.cat,amt:v,m:Q.memo.trim(),k:Q.k||''}]})}
 b.txns.push(t);bump();try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}S.mym=ymOf(t.date);
 if(more){Q.v='';Q.memo='';Q.cn='';qDraw()}else qClose();render();toastUndo('Saved '+money(v),()=>{b.txns=b.txns.filter(x=>x.id!==t.id);bump();render()})}
function qFull(){const ty=Q.t,v=Q.v?String(amt(Q.v)):'',pre=ty==='xfer'?{acct:Q.acct,to:Q.to,amount:v,date:Q.date,memo:Q.memo}:{acct:Q.acct,date:Q.date,contact:contactId(Q.cn),rows:[{a:Q.cat,amt:v,m:Q.memo,k:Q.k},blankRow()]};qClose();openTxn(ty,null,pre)}

document.addEventListener('input',ev=>{const d=ev.target.dataset;if(Q&&d.qf&&d.qf!=='date'&&d.qf!=='k')Q[d.qf]=ev.target.value;if(d.set==='mq'){S.mq=ev.target.value;clearTimeout(keepFocus.h);keepFocus.h=setTimeout(()=>keepFocus(ev.target),220)}});

 if(inField)return;if(/^[0-9.+]$/.test(k))qKey(k);else if(k==='-')qKey('−');else if(k==='Backspace')qKey('⌫');else if(k==='Enter')qSave(false);else return;e.preventDefault();e.stopImmediatePropagation()},true);
